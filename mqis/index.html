<script id="assy-sync-engine">
/* ===== ASSY CLOUD SYNC · Đồng bộ dữ liệu chung qua Cloudflare D1 (/api/sync/<app>) =====
   Dùng chung cho các ứng dụng trong ASSY Portal. Xem: công khai. Ghi: cần mật khẩu sửa (dùng chung với Báo cáo nhân lực).
   Mỗi ứng dụng gọi AssySync.attach({...}) để khai báo dữ liệu nào cần đồng bộ. */
(function () {
  if (window.AssySync) return;
  var REMOTE = window.ASSY_SYNC_REMOTE || 'https://assy-portal.pages.dev';   /* máy chủ dữ liệu chung (dự án tổng ASSY Portal) */
  var H = location.hostname;
  var SAME = /^https?:$/.test(location.protocol) && (H === 'assy-portal.pages.dev' || /\.assy-portal\.pages\.dev$/.test(H) || H === 'localhost' || H === '127.0.0.1');
  var BASE = SAME ? '' : REMOTE;
  var LS_TOKEN = 'dailyhc.token', LS_BY = 'cloud_sync_by';
  var POLL_MS = 10000, DIFF_MS = 3000, CHUNK_ITEMS = 20, CHUNK_CHARS = 2500000;
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function authHeaders(h) { var t = lsGet(LS_TOKEN); h = h || {}; if (t) h['x-hc-token'] = t; return h; }
  function fmt(d) { function p(n) { return String(n).padStart(2, '0'); } return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }

  /* ---------- giao diện: huy hiệu + hộp đăng nhập ---------- */
  ['assy-sync-css'].forEach(function (id) { var e = document.getElementById(id); if (e) e.remove(); });
  [].slice.call(document.querySelectorAll('.assy-sybadge,.assy-login-ov')).forEach(function (e) { e.remove(); });
  var css = document.createElement('style');
  css.id = 'assy-sync-css';
  css.textContent = '.assy-sybadge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font:700 12px/1.25 "Segoe UI",system-ui,sans-serif;' +
    'border:1px solid #cbd5e1;background:#f8fafc;color:#334155;cursor:pointer;white-space:nowrap;vertical-align:middle;margin:0 6px;box-shadow:0 1px 2px rgba(15,23,42,.06)}' +
    '.assy-sybadge i{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block;flex:none}' +
    '.assy-sybadge small{font-weight:600;opacity:.75}' +
    '.assy-sybadge.float{position:fixed;left:12px;bottom:12px;z-index:2147483000;margin:0}' +
    '.assy-sybadge[data-s=ok]{background:#e6f6ee;border-color:#1f9d6b;color:#0d6b45}.assy-sybadge[data-s=ok] i{background:#16a34a}' +
    '.assy-sybadge[data-s=view]{background:#eef6ff;border-color:#60a5fa;color:#1e3a8a}.assy-sybadge[data-s=view] i{background:#3b82f6}' +
    '.assy-sybadge[data-s=busy]{background:#eff6ff;border-color:#2563eb;color:#1e40af}.assy-sybadge[data-s=busy] i{background:#2563eb;animation:assysyp 1s infinite}' +
    '.assy-sybadge[data-s=err]{background:#fef2f2;border-color:#dc2626;color:#991b1b}.assy-sybadge[data-s=err] i{background:#dc2626}' +
    '.assy-sybadge[data-s=login],.assy-sybadge[data-s=seed],.assy-sybadge[data-s=ro]{background:#fff7ed;border-color:#ea580c;color:#9a3412}.assy-sybadge[data-s=login] i,.assy-sybadge[data-s=seed] i,.assy-sybadge[data-s=ro] i{background:#ea580c}' +

    '.assy-login-ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2147483600;display:flex;align-items:center;justify-content:center;font:14px/1.45 "Segoe UI",system-ui,sans-serif}' +
    '.assy-login-ov form{background:#fff;color:#0f172a;border-radius:14px;padding:22px 22px 18px;width:min(360px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}' +
    '.assy-login-ov h3{margin:0 0 4px;font-size:16px}.assy-login-ov p{margin:0 0 12px;color:#475569;font-size:12.5px}' +
    '.assy-login-ov input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}' +
    '.assy-login-ov .er{color:#dc2626;font-size:12px;min-height:18px;margin-top:6px}' +
    '.assy-login-ov .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}' +
    '.assy-login-ov button{padding:8px 14px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:700;cursor:pointer}' +
    '.assy-login-ov button.pri{background:#1e3a8a;border-color:#1e3a8a;color:#fff}';
  document.head.appendChild(css);

  var lastGesture = 0;
  ['pointerdown', 'keydown', 'drop', 'paste', 'change', 'input'].forEach(function (ev) { document.addEventListener(ev, function () { lastGesture = Date.now(); }, true); });
  var loginWait = null, canceledAt = 0;
  /* force=true: luôn hiện hộp đăng nhập · force=false: không hỏi lại nếu vừa bấm Hủy trong 5 phút */
  function login(force, why) {
    if (loginWait) return loginWait;
    if (!force && Date.now() - canceledAt < 300000) return Promise.resolve(false);
    loginWait = new Promise(function (done) {
      var ov = document.createElement('div');
      ov.className = 'assy-login-ov';
      ov.innerHTML = '<form><h3>🔒 Đăng nhập để lưu dữ liệu · 로그인</h3><p>' + (why || 'Nhập mật khẩu sửa của ASSY Portal (dùng chung với Báo cáo nhân lực). Đăng nhập 1 lần dùng cho tất cả ứng dụng.') +
        '</p><input type="password" autocomplete="current-password" placeholder="Mật khẩu / 비밀번호"><div class="er"></div><div class="bt"><button type="button" class="cc">Hủy · 취소</button><button type="submit" class="pri">Đăng nhập · 로그인</button></div></form>';
      document.body.appendChild(ov);
      var f = ov.querySelector('form'), inp = f.querySelector('input'), er = f.querySelector('.er');
      setTimeout(function () { inp.focus(); }, 30);
      function finish(ok) { ov.remove(); loginWait = null; if (!ok) canceledAt = Date.now(); done(ok); }

      f.onsubmit = function (e) {
        e.preventDefault(); er.textContent = '';

          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; }); })
          .then(function (x) {
            if (x.r.ok && x.j.ok) {
              if (x.j.role && x.j.role !== 'edit') { er.textContent = 'Mật khẩu này chỉ có quyền xem – không sửa được.'; inp.select(); return; }
              if (x.j.token) lsSet(LS_TOKEN, x.j.token);
              finish(true);
            } else { er.textContent = 'Sai mật khẩu, thử lại · 비밀번호가 틀렸습니다'; inp.select(); }
          })
          .catch(function () { er.textContent = 'Không kết nối được máy chủ'; });
      };
    });
    return loginWait;
  }

  /* ---------- bộ đồng bộ cho 1 ứng dụng ---------- */
  function attach(spec) {

    var maps = {}; (spec.maps || []).forEach(function (k) { maps[k] = 1; });
    var skipTop = {}, skipIn = {};

    var S = { base: {}, dirty: new Set(), ready: false, lastVer: 0, pushing: false, again: false, pushTimer: null, pollTimer: null,
      deferRender: false, state: 'off', userDirty: false, ro: false, seeded: true, authBlocked: false, viewOnly: false, seedPending: false };

    /* badge */
    var badge = document.createElement('button');
    badge.type = 'button'; badge.className = 'assy-sybadge';
    function place() {
      var a = spec.anchor && (typeof spec.anchor === 'function' ? spec.anchor() : document.querySelector(spec.anchor));
      if (a && a.parentNode) { badge.classList.remove('float'); a.insertAdjacentElement(spec.anchorPos || 'afterend', badge); }
      else { badge.classList.add('float'); document.body.appendChild(badge); }

    place();
    function show(s, vi, ko, title) {
      S.state = s; badge.dataset.s = s;
      badge.innerHTML = '<i></i><span>☁ ' + vi + '</span>' + (ko ? '<small>' + ko + '</small>' : '');
      badge.title = title || '';
    }
    function showOk() {
      if (S.ro) return show('ro', 'Đã đồng bộ ' + fmt(new Date()) + ' · chỉ xem', '읽기 전용', 'Mật khẩu hiện tại chỉ có quyền xem. Bấm để đăng nhập quyền sửa.');
      if (S.authBlocked && S.userDirty && S.dirty.size) return show('login', 'Có thay đổi chưa lưu – bấm để đăng nhập', '로그인 필요', 'Thay đổi của bạn mới chỉ lưu trên máy này');
