<style>

const pv=k=>$("pv_"+k).innerHTML=(ed.r[k]||[]).map((s,j)=>`<span><img class="th" src="${s}"><i onclick="ed.r['${k}'].splice(${j},1);pv('${k}')">×</i></span>`).join("");
function shrink(f){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onerror=()=>res(null);im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.9))};im.src=fr.result};fr.readAsDataURL(f)})}
const prep=b=>b.size>150000?shrink(b):new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>res(fr.result);im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(b)});
async function addImg(el,k){for(const f of el.files){const d=await prep(f);if(d)(ed.r[k]=ed.r[k]||[]).push(d)}el.value="";pv(k)}
function saveRec(){const r=ed.r;FLD.forEach(([k])=>r[k]=$("f_"+k).value.trim());r.name=$("f_name").value.trim();r.note=$("f_note").value.trim();
if(!r.model||!r.name){alert("Cần nhập Model và Tên lỗi.");return}
if(!r.id)r.id=uid();const key=K(ed.m);S.data[key]=S.data[key]||[];ed.i<0?S.data[key].push(r):S.data[key][ed.i]=r;reno(ed.m);persist([{t:"set",key,rec:r}]);$("md").classList.remove("on");render()}
function del(i){if(confirm("Xóa dòng lỗi này?")){const id=get(cur)[i].id;get(cur).splice(i,1);reno(cur);persist([{t:"del",key:K(cur),id}]);render()}}
const dl=(n,t,type)=>{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([t],{type}));l.download=n;l.click()};
const rowv=r=>COLS.map(c=>c[0]=="img"?(r.img||[]).length+" ảnh":r[c[0]]);const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
function csv(m){dl(`MQIS_${Y}_T${m}.csv`,"\ufeff"+[COLS.map(c=>c[1])].concat(get(m).map(rowv)).map(r=>r.map(q).join(",")).join("\n"),"text/csv")}

async function dlHtml(){
try{const a=document.activeElement;if(a&&a.blur)a.blur();await new Promise(r=>setTimeout(r,250));
let src="";
try{const r=await fetch(location.href.split("#")[0],{cache:"no-store"});if(r.ok){const t=await r.text();if(t.indexOf("const SEED=")>=0)src=t}}catch(e){}
if(!src){const c=document.documentElement.cloneNode(true);
["nav","main","mb","toast","sync"].forEach(id=>{const e=c.querySelector("#"+id);if(e){e.innerHTML="";e.className=e.className.replace(/\bon\b/g,"").trim()}});
c.querySelectorAll(".mask.on").forEach(e=>e.classList.remove("on"));
c.removeAttribute("data-theme");
src="<!DOCTYPE html>\n"+c.outerHTML}
const a1=src.indexOf("const SEED="),a2=src.indexOf(";\nconst MON=",a1);
if(a1<0||a2<0)throw new Error("no seed");
const data=JSON.stringify(S.data).replace(/<\//g,"<\\/").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
let out=src.slice(0,a1)+"const SEED="+data+src.slice(a2);
out=out.replace(/S=\{data:SEED,years:\[[^\]]*\],v:3\};/,()=>"S={data:SEED,years:"+JSON.stringify(S.years)+",v:3};");
const d=new Date(),p=n=>String(n).padStart(2,"0"),stamp=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes());
dl("MQIS_"+Y+"_Bao_cao_"+stamp+".html",out,"text/html;charset=utf-8");
toast("✔ Đã tạo file HTML với dữ liệu mới nhất")}
catch(e){alert("Không tạo được file HTML. Hãy dùng 'Sao lưu JSON' để giữ dữ liệu.")}}
