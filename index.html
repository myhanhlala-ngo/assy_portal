<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f3a">
<title>ASSY DIGITAL PORTAL · 조립 통합 관리 시스템</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1f3a'/%3E%3Cpath d='M8 23V12l5 3V12l5 3V9h6v14z' fill='%23f39200'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0b1f3a;--navy-2:#11294b;--navy-3:#183660;--line-d:rgba(255,255,255,.08);
  --brand:#f39200;--brand-d:#d97e00;--ink:#0f1b2d;--ink-2:#475569;--ink-3:#8492a6;
  --bg:#eef2f7;--card:#fff;--line:#e2e8f0;--blue:#1d4ed8;
  --g-prod:#1d4ed8;--g-prod-bg:#e8efff;--g-hr:#0f766e;--g-hr-bg:#e3f5f2;--g-qa:#b45309;--g-qa-bg:#fdf1e2;
  --side-w:252px;--side-c:68px;--top-h:56px;
  font-family:"Segoe UI","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top-h);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px 0 12px;z-index:50}
.top .burger{width:38px;height:38px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.top .burger:hover{background:#f1f5f9}
.logo{display:inline-flex;align-items:center;padding:5px 10px;border:1px solid #f0d9bf;border-left:4px solid var(--brand);border-radius:0 6px 6px 0;background:#fff}
.logo img{height:22px;width:auto;display:block}
.ptitle{display:flex;flex-direction:column;line-height:1.15;padding-left:14px;border-left:1px solid var(--line);min-width:0}
.ptitle b{font-size:15px;letter-spacing:.06em;color:var(--navy);white-space:nowrap}
.ptitle small{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;margin-left:10px;padding-left:16px;border-left:1px solid var(--line);font-size:14px;color:var(--ink-3);min-width:0}
.crumb .cur{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .cur small{font-weight:400;color:var(--ink-3);margin-left:6px}
.crumb a{color:var(--ink-3);text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--blue)}
.sp{flex:1}
.clock{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.clock .t{font-size:15px;font-weight:600;color:var(--navy)}
.shift{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:#fff6e8;color:#9a5a00;border:1px solid #f6d8a8}
.shift.night{background:#eef1ff;color:#3730a3;border-color:#c7cdfa}
.shift i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f8fafc}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--navy);color:#fff}
.tbtn{height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{border-color:#cbd5e1;background:#f8fafc;color:var(--ink)}
.tbtn .ico{width:17px;height:17px}
.appact{display:none;gap:6px}.appact.show{display:flex}

/* ---------- sidebar ---------- */
.side{position:fixed;top:var(--top-h);bottom:0;left:0;width:var(--side-w);background:var(--navy);color:#cbd6e6;display:flex;flex-direction:column;z-index:40;transition:width .18s ease}
.side .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px}
.side .scroll::-webkit-scrollbar{width:6px}.side .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.grp{margin:14px 10px 6px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:#7f93b2;white-space:nowrap;display:flex;gap:6px;align-items:center}
.grp em{font-style:normal;font-weight:500;letter-spacing:.02em;color:#5f7697}
.nav{position:relative;width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#cbd6e6;border-radius:8px;padding:9px 12px;margin:1px 0;text-align:left;white-space:nowrap}
.nav:hover{background:var(--navy-2);color:#fff}
.nav.on{background:var(--navy-3);color:#fff}
.nav.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav .lbl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nav .lbl b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.nav .lbl small{font-size:11px;color:#7f93b2}
.nav.on .lbl small{color:#a9bbd6}
.nav .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15);flex:none}
.nav .ext{margin-left:auto;width:14px;height:14px;opacity:.5}
.side .foot{border-top:1px solid var(--line-d);padding:12px 18px;font-size:11px;color:#6d84a6;line-height:1.5;white-space:nowrap;overflow:hidden}
.side .foot b{color:#a9bbd6;font-weight:600}
body.collapsed .side{width:var(--side-c)}
body.collapsed .side .lbl,body.collapsed .grp em,body.collapsed .nav .dot,body.collapsed .nav .ext,body.collapsed .side .foot span{display:none}
body.collapsed .grp{justify-content:center;margin:12px 0 4px;font-size:0}
body.collapsed .grp::after{content:"";display:block;width:22px;height:1px;background:var(--line-d)}
body.collapsed .nav{justify-content:center;padding:10px 0}
.tip{position:fixed;z-index:80;background:var(--navy);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(2,8,23,.25);display:none}

/* ---------- main ---------- */
.main{position:fixed;top:var(--top-h);right:0;bottom:0;left:var(--side-w);transition:left .18s ease}
body.collapsed .main{left:var(--side-c)}
#appFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#appFrame.show{display:block}
.bar{position:absolute;left:0;top:0;height:3px;width:0;background:var(--brand);z-index:5;transition:width .5s ease,opacity .3s}
.bar.run{width:75%}.bar.done{width:100%;opacity:0}

/* ---------- overview ---------- */
#home{position:absolute;inset:0;overflow:auto;padding:26px 30px 40px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.hero h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.01em;color:var(--navy)}
.hero h1 .eb{display:block;font-size:12.5px;font-weight:600;color:var(--brand-d);letter-spacing:.14em;margin-bottom:8px}
.hero p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px}
.stat small{display:block;font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.stat b{font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}
.section{margin-top:22px}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sh .tag{width:4px;height:18px;border-radius:2px}
.sh b{font-size:15px;color:var(--ink)}
.sh small{font-size:12.5px;color:var(--ink-3)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:#c7d2e3;box-shadow:0 8px 24px rgba(15,27,45,.08);transform:translateY(-2px)}
.card .hd{display:flex;align-items:center;gap:12px}
.card .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.card .ic .ico{width:21px;height:21px}
.card .nm{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.card .nm b{font-size:15px;color:var(--ink)}
.card .nm small{font-size:12px;color:var(--ink-3)}
.card .code{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);font-family:Consolas,"Cascadia Mono",monospace}
.card p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5;min-height:39px}
.card .ft{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px;font-size:12px}
.card .st{display:inline-flex;align-items:center;gap:6px;color:#15803d;font-weight:600}
.card .st i{width:7px;height:7px;border-radius:50%;background:#22c55e}
.card .st.ext{color:var(--ink-3)}.card .st.ext i{background:#94a3b8}
.card .go{color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.g-prod .ic{background:var(--g-prod-bg);color:var(--g-prod)}.g-prod .tag{background:var(--g-prod)}
.g-hr .ic{background:var(--g-hr-bg);color:var(--g-hr)}.g-hr .tag{background:var(--g-hr)}
.g-qa .ic{background:var(--g-qa-bg);color:var(--g-qa)}.g-qa .tag{background:var(--g-qa)}
.note{margin-top:26px;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:12px 16px;font-size:13px;color:var(--ink-2);line-height:1.55}
.note b{color:var(--ink)}

[data-lang=kr] .vi{display:none}[data-lang=vi] .kr{display:none}

@media (max-width:1100px){.clock .d,.ptitle small{display:none}}
@media (max-width:860px){
  .ptitle,.clock,.crumb{display:none}
  .logo img{height:18px}
  .side{transform:translateX(-100%);transition:transform .2s;width:var(--side-w)!important}
  body.mopen .side{transform:none}
  body.collapsed .side .lbl{display:flex}
  .main,body.collapsed .main{left:0}
  #home{padding:18px 16px 30px}
}
@media print{.top,.side{display:none}.main{position:static}}
</style>

 GROUPS.forEach(g=>{
  h+=`<div class="grp">${T(g.vi,g.kr)}<em>${g.id==='prod'?'PRODUCTION':g.id==='hr'?'MANPOWER':'QUALITY'}</em></div>`;
  Object.entries(apps).filter(([,a])=>a.g===g.id).forEach(([id,a])=>{
   h+=`<button class="nav" data-app="${id}" data-tip="${a.vi} · ${a.kr}" onclick="openApp('${id}')">${svg(a.icon)}<span class="lbl"><b>${T(a.vi,a.kr)}</b><small>${T(a.kr,a.vi)}</small></span>${a.ext?svg('ext','ext'):'<span class="dot" title="Đồng bộ dữ liệu chung"></span>'}</button>`;
  });
 });
 $('nav').innerHTML=h;
 $('nav').querySelector('[data-app=home]').dataset.tip='Tổng quan · 종합 현황';
}
function buildHome(){
 const n=Object.keys(apps).length;
 let h=`<div class="hero"><div><h1><span class="eb">ASSEMBLY DEPARTMENT · INTOPS VINA</span>${T('Trung tâm quản lý bộ phận Lắp ráp','조립팀 통합 관리 센터')}</h1>
 <p>${T('Truy cập nhanh các hệ thống sản xuất, nhân lực và chất lượng – dữ liệu dùng chung, cập nhật tức thời giữa các máy.','생산 · 인원 · 품질 시스템을 한 곳에서 – 모든 PC에서 실시간으로 공유되는 데이터.')}</p></div>
 <div class="stats"><div class="stat"><small>${T('ỨNG DỤNG','시스템')}</small><b>${n}</b></div><div class="stat"><small>${T('NHÓM','분류')}</small><b>3</b></div><div class="stat"><small>${T('DỮ LIỆU','데이터')}</small><b style="font-size:15px;color:#15803d">● ${T('Đồng bộ','실시간 동기화')}</b></div></div></div>`;
 GROUPS.forEach(g=>{
  h+=`<div class="section ${g.cls}"><div class="sh"><span class="tag"></span><b>${T(g.vi,g.kr)}</b><small>${T(g.dvi,g.dkr)}</small></div><div class="cards">`;
  Object.entries(apps).filter(([,a])=>a.g===g.id).forEach(([id,a])=>{
   h+=`<button class="card ${g.cls}" onclick="openApp('${id}')"><span class="code">${a.code}</span><div class="hd"><span class="ic">${svg(a.icon)}</span><span class="nm"><b>${T(a.vi,a.kr)}</b><small>${T(a.kr,a.vi)}</small></span></div>
   <p>${T(a.dvi,a.dkr)}</p><div class="ft">${a.ext?`<span class="st ext"><i></i>${T('Dự án riêng','별도 프로젝트')}</span>`:`<span class="st"><i></i>${T('Dữ liệu chung','공유 데이터')}</span>`}<span class="go">${T('Mở ứng dụng','열기')} ${svg('arrow')}</span></div></button>`;
  });
  h+='</div></div>';
 });
 h+=`<div class="note">${svg('shield')}<div>${T('<b>Xem</b> không cần đăng nhập. <b>Sửa</b> cần mật khẩu sửa của ASSY Portal – đăng nhập 1 lần dùng cho mọi ứng dụng. Huy hiệu <b>☁ Đã đồng bộ</b> trong mỗi ứng dụng cho biết dữ liệu đã lưu lên máy chủ.','<b>조회</b>는 로그인 없이 가능합니다. <b>수정</b>은 ASSY 포털 수정 비밀번호가 필요하며, 한 번 로그인하면 모든 시스템에 적용됩니다. 각 시스템의 <b>☁ 동기화됨</b> 표시는 서버 저장 완료를 의미합니다.')}</div></div>`;
 $('home').innerHTML=h;
 $('home').querySelectorAll('.card .go .ico').forEach(e=>{e.style.width='15px';e.style.height='15px'});
}
function setCrumb(){
 const a=currentApp&&apps[currentApp];
 $('crumb').innerHTML=a?`<a onclick="goHome()">${T('Tổng quan','종합 현황')}</a><span>›</span><span class="cur">${lang==='vi'?a.vi:a.kr}<small>${lang==='vi'?a.kr:a.vi}</small></span>`
  :`<span class="cur">${T('Tổng quan','종합 현황')}</span>`;
}
function setLanguage(next){
 lang=next==='kr'?'kr':'vi';document.body.dataset.lang=lang;document.documentElement.lang=lang==='vi'?'vi':'ko';
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 try{localStorage.setItem('assy_portal_lang',lang)}catch(e){}
 setCrumb();tick();
}
function toggleLang(){setLanguage(lang==='vi'?'kr':'vi')}
function markActive(id){document.querySelectorAll('.nav').forEach(el=>el.classList.toggle('on',el.dataset.app===id))}
function goHome(){
 currentApp=null;frame.classList.remove('show');frame.removeAttribute('src');delete frame.dataset.app;
 $('home').style.display='block';$('appAct').classList.remove('show');
 markActive('home');setCrumb();history.replaceState(null,'',location.pathname);document.body.classList.remove('mopen');
}
function openWorkReport(){openApp('daily-work-report')}
function openApp(id){
 if(!apps[id])return;
 currentApp=id;markActive(id);setCrumb();
 $('home').style.display='none';$('appAct').classList.add('show');frame.classList.add('show');
 if(frame.dataset.app!==id){frame.dataset.app=id;startBar();frame.src=apps[id].url}
 history.replaceState(null,'',location.pathname+'#'+id);document.body.classList.remove('mopen');
}
function startBar(){const b=$('bar');b.className='bar';void b.offsetWidth;b.classList.add('run')}
frame.addEventListener('load',()=>{const b=$('bar');b.classList.add('done')});
function reloadApp(){if(currentApp){startBar();try{frame.contentWindow.location.reload()}catch(e){frame.src=apps[currentApp].url}}}
function openExternal(){if(currentApp)window.open(apps[currentApp].url,'_blank','noopener')}

const DOW={vi:['CN','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'],kr:['일','월','화','수','목','금','토']};
function tick(){
 const d=new Date(),p=n=>String(n).padStart(2,'0'),h=d.getHours(),night=h<8||h>=20;
 $('clock').innerHTML=`<span class="d">${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} (${DOW[lang][d.getDay()]})</span><span class="t">${p(h)}:${p(d.getMinutes())}</span><span class="shift${night?' night':''}"><i></i>${night?T('Ca đêm','야간'):T('Ca ngày','주간')}</span>`;
}
$('burger').addEventListener('click',()=>{
 if(innerWidth<=860){document.body.classList.toggle('mopen');return}
 document.body.classList.toggle('collapsed');
 try{localStorage.setItem('assy_portal_side',document.body.classList.contains('collapsed')?'c':'')}catch(e){}
});
const tip=$('tip');
$('nav').addEventListener('mouseover',e=>{const n=e.target.closest('.nav');if(!n||!document.body.classList.contains('collapsed'))return;const r=n.getBoundingClientRect();tip.textContent=n.dataset.tip||'';tip.style.left=(r.right+10)+'px';tip.style.top=(r.top+r.height/2-14)+'px';tip.style.display='block'});
$('nav').addEventListener('mouseout',()=>tip.style.display='none');
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(apps[id])openApp(id);else goHome()});

buildNav();buildHome();setLanguage(lang);tick();setInterval(tick,15000);
const initial=location.hash.slice(1);if(apps[initial])openApp(initial);else goHome();
</script>
</body>
</html>
